onboarding = false
[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

status_indicators = "symbols"

# Agent counts reported by the Spaces plugin (lukecameron/herdr-spaces).
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", "git_status", { token = "$agent_summary", dim = true }],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", { token = "$subagents", dim = true }],
]

[experimental]
# Experimental local Kitty graphics rendering for attached clients.
kitty_graphics = true

[theme]
name = "catppuccin"
auto_switch = false

# Navigate mode (prefix+w): j/k move between workspaces, like the arrows.
# Pane up/down move to shift+j/shift+k to free j/k.
[keys]
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
navigate_pane_up = ["shift+k"]
navigate_pane_down = ["shift+j"]
