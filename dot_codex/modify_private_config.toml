#!/usr/bin/awk -f

function emit_missing(    i, key) {
  for (i = 1; i <= managed_count; i++) {
    key = managed_order[i]
    if (!seen[key]) {
      print key " = " managed_value[key]
      seen[key] = 1
    }
  }
}

BEGIN {
  managed_order[++managed_count] = "model"
  managed_order[++managed_count] = "model_reasoning_effort"
  managed_order[++managed_count] = "approval_policy"
  managed_order[++managed_count] = "sandbox_mode"
  managed_order[++managed_count] = "service_tier"

  managed_value["model"] = "\"gpt-5.6-sol\""
  managed_value["model_reasoning_effort"] = "\"xhigh\""
  managed_value["approval_policy"] = "\"on-request\""
  managed_value["sandbox_mode"] = "\"workspace-write\""
  managed_value["service_tier"] = "\"default\""

  in_top_level = 1
}

in_top_level && /^\[/ {
  emit_missing()
  in_top_level = 0
}

in_top_level && /^[A-Za-z0-9_-]+[[:space:]]*=/ {
  key = $0
  sub(/[[:space:]]*=.*$/, "", key)

  if (key in managed_value) {
    print key " = " managed_value[key]
    seen[key] = 1
    next
  }

  if (key == "approvals_reviewer") {
    next
  }
}

{ print }

END {
  if (in_top_level) {
    emit_missing()
  }
}
